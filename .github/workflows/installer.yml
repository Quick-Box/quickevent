name: Installer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  windows:
    name: Qt 6.11 / Windows / ${{ matrix.suffix }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          # MinGW Qt has only a dummy Qt Bluetooth backend (no BLE card readers), MSVC Qt has the real one.
          - toolchain: mingw
            suffix: mingw-no-bluetooth
            qt_arch: win64_mingw
            windeployqt_args: ''
          - toolchain: msvc
            suffix: msvc
            qt_arch: win64_msvc2022_64
            windeployqt_args: --no-compiler-runtime
    steps:
      - name: Clone the repository
        uses: actions/checkout@v5
        with:
          submodules: true

#     - name: Cache libraries
#       id: cache-libs
#       uses: actions/cache@v3
#       with:
#         path: |
#           C:/openssl/bin/libssl-1_1-x64.dll
#           C:/openssl/bin/libcrypto-1_1-x64.dll
#           C:/Program Files/PostgreSQL/14/bin/libiconv-2.dll
#           C:/Program Files/PostgreSQL/14/bin/libintl-9.dll
#           C:/Program Files/PostgreSQL/14/bin/liblz4.dll
#           C:/Program Files/PostgreSQL/14/bin/zlib1.dll
#           C:/Program Files/PostgreSQL/14/bin/libpq.dll
#         key: ${{ runner.os }}-library-cache

      - name: Setup MinGW cache
        if: matrix.toolchain == 'mingw'
        uses: actions/cache@v5
        with:
          key: x86_64-13.1.0-release-posix-seh-msvcrt-rt_v11-rev1.7z
          path: ${{github.workspace}}/x86_64-13.1.0-release-posix-seh-msvcrt-rt_v11-rev1.7z

      - name: Install MinGW
        if: matrix.toolchain == 'mingw'
        # WinMain apps fail to link with the default MinGW compiler on GH actions. I suspect it is because Qt (since
        # 6.8) uses msvcrt, but GH Actions uses the ucrt version. Furthermore, GH Actions might have an older MinGW
        # version which might make things even less compatible. I don't know the exact reasoning. This works, and that's
        # all that matters for me.
        run: |
          MINGW_FILE_NAME='x86_64-13.1.0-release-posix-seh-msvcrt-rt_v11-rev1.7z'
          if ! [[ -f '${{github.workspace}}'/"$MINGW_FILE_NAME" ]]; then
            curl -L "https://github.com/niXman/mingw-builds-binaries/releases/download/13.1.0-rt_v11-rev1/$MINGW_FILE_NAME" -o '${{github.workspace}}'/"$MINGW_FILE_NAME"
          fi
          7z x '${{github.workspace}}'/"$MINGW_FILE_NAME"
          echo 'CC=${{github.workspace}}/mingw64/bin/gcc.exe' >> "$GITHUB_ENV"
          echo 'CXX=${{github.workspace}}/mingw64/bin/g++.exe' >> "$GITHUB_ENV"
        shell: bash

      - name: Get libraries
#         if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          choco install openssl.light --params "/InstallDir:C:\openssl" --version=3.1.4 -y
          choco install postgresql17 -y
          choco install innosetup -y
        shell: cmd

      - name: Setup CMake
        uses: ./.github/actions/cmake
        with:
          qt_version: 6.11.2
          qt_arch: ${{ matrix.qt_arch }}
          toolchain: ${{ matrix.toolchain }}
          use_qt6: ON
          modules: qtserialport qtmultimedia qtconnectivity qtwebsockets qtnetworkauth qttasktree
          additional_cmake_args: -DCMAKE_INSTALL_PREFIX='${{ github.workspace }}/install'

      - name: Build
        run: cmake --build '${{github.workspace}}/build' --parallel "$(nproc)"
        shell: bash

      - name: Install
        run: cmake --install '${{ github.workspace }}/build'
        shell: bash

      - name: Run windeployqt
        # Report templates are embedded as resources, scan their sources so that QML modules they import (QtQml, ...) are deployed
        run: windeployqt -serialport -multimedia ${{ matrix.windeployqt_args }} --qmldir '${{ github.workspace }}/install/bin/qml' --qmldir '${{ github.workspace }}/quickevent/app/quickevent/plugins' '${{ github.workspace }}/install/bin/quickevent.exe'

      - name: Copy MinGW runtime libraries
        if: matrix.toolchain == 'mingw'
        # windeployqt is unable to copy those, because it looks for them next to where g++.exe is. On the GitHub runner,
        # they are in a different directory.
        run: |
          cd "${{github.workspace}}/mingw64/bin"
          cp {libstdc++-6.dll,libgcc_s_seh-1.dll,libwinpthread-1.dll} '${{ github.workspace }}/install/bin'
        shell: bash

      - name: Copy MSVC runtime libraries
        if: matrix.toolchain == 'msvc'
        # App-local deployment, so neither the installer nor the 7zip needs the VC++ redistributable installed.
        run: cp "$(cygpath -u "$VCToolsRedistDir")"/x64/Microsoft.VC*.CRT/*.dll '${{ github.workspace }}/install/bin'
        shell: bash

      - name: Copy PostgreSQL runtime libraries
        run: |
          cd "C:/Program Files/PostgreSQL/17/bin"
          cp libiconv-2.dll libintl-9.dll liblz4.dll zlib1.dll libpq.dll '${{ github.workspace }}/install/bin/'
          # libintl-9.dll needs libwinpthread-1.dll, MinGW build already has its own copy
          cp -n libwinpthread-1.dll '${{ github.workspace }}/install/bin/'
          cd "C:\openssl"
          cp libssl-3-x64.dll libcrypto-3-x64.dll '${{ github.workspace }}/install/bin/'
        shell: bash

      - name: Check PostgreSQL driver loads
        # Clean PATH, so DLLs of PostgreSQL, OpenSSL or MinGW installed on the runner cannot hide a missing one
        shell: pwsh
        run: |
          Add-Type -Name Native -Namespace Win32 -MemberDefinition '[DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Unicode)] public static extern IntPtr LoadLibrary(string path);'
          $env:PATH = '${{ github.workspace }}\install\bin;C:\Windows\System32'
          if ([Win32.Native]::LoadLibrary('${{ github.workspace }}\install\bin\sqldrivers\qsqlpsql.dll') -eq [IntPtr]::Zero) {
            throw "qsqlpsql.dll failed to load, Win32 error $([Runtime.InteropServices.Marshal]::GetLastWin32Error())"
          }

      - name: Bundle Typst binary
        run: |
          curl -L "https://github.com/typst/typst/releases/download/${{ env.TYPST_VERSION }}/typst-x86_64-pc-windows-msvc.zip" -o typst.zip
          7z e typst.zip -r -o'${{ github.workspace }}/install/bin' typst.exe
        shell: bash
        env:
          TYPST_VERSION: v0.15.0

      - name: Get app version
        run: echo "VERSION=$(grep APP_VERSION quickevent/app/quickevent/src/appversion.h | cut -d\" -f2)" >> "$GITHUB_ENV"
        shell: bash

      - name: Create installer
        run: iscc "-DBUILD_DIR=${{ github.workspace }}/install" "-DVERSION=${{ env.VERSION }}" "-DSUFFIX=-${{ matrix.suffix }}" quickevent/quickevent.iss

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: quickevent-${{ env.VERSION }}-${{ matrix.suffix }}-setup.exe
          path: ${{ github.workspace }}/install/_inno/quickevent/quickevent-*-setup.exe

      - name: Create 7zip
        shell: pwsh
        run: 7z a -t7z -mx=9 ${{ github.workspace }}/install/quickevent-${{ env.VERSION }}-${{ matrix.suffix }}.7z ${{ github.workspace }}/install/bin/*

      - name: Upload 7zip
        uses: actions/upload-artifact@v7
        with:
          name: quickevent-${{ env.VERSION }}-${{ matrix.suffix }}.7z
          path: ${{ github.workspace }}/install/quickevent-${{ env.VERSION }}-${{ matrix.suffix }}.7z
          archive: false
